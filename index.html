*{box-sizing:border-box}

main{max-width:640px;margin:0 auto;padding:16px 14px 32px}
h1{font-size:22px;margin:4px 0 2px;font-weight:700;letter-spacing:.08em}
.sub{margin:0 0 14px;font-size:13px;opacity:.85}
.read{background:var(--card);color:var(--ink);border-left:8px solid var(--red);padding:16px 16px;border-radius:2px;min-height:150px}

.read .hint{font-size:clamp(28px,7.5vw,40px);margin-top:10px;line-height:1.45;font-weight:700}
.bar{display:flex;justify-content:space-between;font-size:14px;margin:12px 0 8px}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.c{background:var(--card);color:var(--ink);border:0;border-radius:2px;min-height:178px;padding:10px 6px;font:inherit;font-size:19px;font-weight:700;writing-mode:vertical-rl;text-orientation:upright;cursor:pointer;box-shadow:0 2px 0 #0004}
.c.long{font-size:15px}
.c.xl{font-size:12px}
.c:focus-visible{outline:3px solid #ffd54a}
.c{position:relative}
.c.ok{background:var(--card);padding-top:44px}
.c.ok::after{content:"◎";position:absolute;top:6px;left:0;right:0;text-align:center;writing-mode:horizontal-tb;font-size:30px;line-height:1;color:var(--red)}
.c.rt2{background:#f4c7c1}
.c.ng{background:#d8d5c8;color:#6f6b5e;padding-top:44px}
.c.ng::after{content:"✕";position:absolute;top:6px;left:0;right:0;text-align:center;writing-mode:horizontal-tb;font-size:30px;line-height:1;font-weight:700;color:#2b2a26}

.c.shake{animation:s .25s}
@keyframes s{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.end{text-align:center;background:var(--card);color:var(--ink);padding:24px 16px;border-radius:2px}
.end b{font-size:34px;color:var(--red)}
button.go{font:inherit;font-size:16px;background:var(--red);color:#fff;border:0;padding:10px 24px;border-radius:2px;margin-top:12px;cursor:pointer}
.ans{margin-top:14px;background:var(--card);color:var(--ink);border-left:8px solid var(--red);padding:12px 14px;border-radius:2px;font-size:18px}
.ans p{margin:4px 0}
.ans a{display:inline-block;margin:6px 14px 6px 0;color:var(--red);font-weight:700;font-size:18px}
.ans .go{margin-top:6px}
.end .go{display:block;margin:14px auto 0}
.rt{font-size:22px;margin:22px 0 8px}
.rl{list-style:none;margin:0;padding:0}
.rv{display:flex;gap:12px;background:var(--card);color:var(--ink);border-left:8px solid var(--red);padding:10px 12px;margin-bottom:8px;border-radius:2px;font-size:18px}
.rv .mk{font-size:30px;line-height:1.1;min-width:34px;text-align:center}
.rv .mk.o{color:var(--red)}
.rv .mk.x{color:#2b2a26;font-weight:700}
.rv .mt{font-size:15px;color:#5a5548;margin:2px 0}
.rv a{display:inline-block;margin:4px 14px 2px 0;color:var(--red);font-weight:700}
@media(min-width:560px){.board{grid-template-columns:repeat(8,1fr)}}
@media(prefers-reduced-motion:reduce){.c.shake{animation:none}}
</style></head><body><main>

      const all=b.querySelectorAll(".c");all.forEach(x=>x.disabled=true);
      if(f===q){score++;res.push([q,1]);c.classList.add("ok")}
      else{res.push([q,0]);c.classList.add("ng","shake");b.querySelector("[data-a]").classList.add("rt2")}
      showAns(q)
    };b.appendChild(c)})}
function showAns(q){
  const last=i>=9;
  $.insertAdjacentHTML("beforeend",`<div class="ans"><button class="go" id="nx">${last?"答え合わせへ":"次の問題へ"}</button></div>`);
  document.getElementById("nx").onclick=()=>{++i<10?ask():end()};
  document.getElementById("nx").scrollIntoView({block:"nearest"})}
function end(){
  const L=res.map(([q,ok],n)=>{const e=encodeURIComponent(q.t+" 映画");
    return `<li class="rv"><span class="mk ${ok?"o":"x"}">${ok?"◎":"✕"}</span><div><b>第${n+1}問　${q.t}</b><div class="mt">${q.d}／${q.y}年（${era(q.y)}）${q.k?"／配給："+q.k:""}</div><div><a href="https://ja.wikipedia.org/w/index.php?search=${e}" target="_blank" rel="noopener">Wikipediaで調べる</a><a href="https://www.google.com/search?q=${e}+公式サイト" target="_blank" rel="noopener">公式サイトを探す</a></div></div></li>`}).join("");
  $.innerHTML=`<div class="end"><p>正解</p><b>${score} / 10</b><button class="go" id="r">もう一度</button></div><h2 class="rt">答え合わせ</h2><ol class="rl">${L}</ol>`;
  document.getElementById("r").onclick=start;window.scrollTo(0,0)}
start();
</script></body></html>
